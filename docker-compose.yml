services:
  postgres:
    image: postgres:15-alpine
    container_name: flightops-postgres
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flightops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-flightops}
      TZ: ${TIMEZONE}
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flightops-network
    restart: unless-stopped

  backend:
    image: ghcr.io/dropzoneninja/flightops-backend:latest
    container_name: flightops-backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-flightops}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DATABASE_NAME: ${POSTGRES_DB:-flightops}
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      PORT: 3000
      NODE_ENV: production
      TZ: ${TIMEZONE}
      # Force Node.js to prefer IPv4 over IPv6 (fixes ETIMEDOUT with IPv6 routing issues)
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      BACKUP_DIR: /backups
      POSTGRES_CONTAINER_NAME: flightops-postgres
      MEDIA_STORAGE_PATH: /app/media
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-524288000}
    # DNS servers for external API access (Open-Meteo)
    dns:
      - 8.8.8.8      # Google DNS primary
      - 8.8.4.4      # Google DNS secondary
      - 1.1.1.1      # Cloudflare DNS
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ${MEDIA_STORAGE_PATH:-./media}:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flightops-network
    restart: unless-stopped

  frontend:
    image: ghcr.io/dropzoneninja/flightops-frontend:latest
    container_name: flightops-frontend
    environment:
      TZ: ${TIMEZONE}
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - flightops-network
    restart: unless-stopped

networks:
  flightops-network:
    driver: bridge
