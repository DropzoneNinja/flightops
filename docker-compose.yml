version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: flightops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flightops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-flightops}
      TZ: ${TIMEZONE}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flightops-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flightops-backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-flightops}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DATABASE_NAME: ${POSTGRES_DB:-flightops}
      JWT_SECRET: ${JWT_SECRET:-changeme-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      PORT: 3000
      NODE_ENV: production
      TZ: ${TIMEZONE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flightops-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flightops-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      TZ: ${TIMEZONE}
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - flightops-network
    restart: unless-stopped

networks:
  flightops-network:
    driver: bridge
